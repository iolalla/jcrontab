# =========================================================================
# Log4j 2.x Configuration Example for Jcrontab
# Save as log4j2.properties in your classpath or working directory
# =========================================================================

# Status logger configuration (internal Log4j 2 diagnostics)
status = WARN
name = JcrontabLog4j2Config

# Console Appender
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Root Logger configuration
rootLogger.level = INFO
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = ConsoleAppender

# Jcrontab specific loggers
logger.jcrontab.name = jcrontab
logger.jcrontab.level = INFO

logger.cron4web.name = Cron4Web
logger.cron4web.level = INFO

logger.orgjcrontab.name = org.jcrontab
logger.orgjcrontab.level = INFO
