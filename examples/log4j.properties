# =========================================================================
# Log4j 1.x Configuration Example for Jcrontab
# =========================================================================

# Set root logger level to INFO and its only appender to stdout
log4j.rootLogger=INFO, stdout

# Direct log messages to System.out
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c - %m%n

# Configure logging levels for Jcrontab components
log4j.logger.jcrontab=INFO
log4j.logger.Cron4Web=INFO
log4j.logger.org.jcrontab=INFO
